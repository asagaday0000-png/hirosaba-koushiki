<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひろ鯖 - 公式サイト</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #202020;
            color: white;
            text-align: center;
        }

        header {
            padding: 80px 20px;
            background: #2d7d46;
        }

        .logo {
            width: 150px;
            height: auto;
            display: block;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 56px;
            margin: 0 0 15px;
        }

        p {
            font-size: 20px;
        }

        .content {
            padding: 50px 20px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <img src="ひろ鯖ロゴ.png" alt="ひろ鯖ロゴ" class="logo">
    <p>Minecraftをみんなで楽しもう！</p>
</header>

<div class="content">
    <h2>ひろ鯖公式サイト</h2>
    <p>サーバー情報やルールなどを掲載しています。</p>

    <a class="button" href="#">
        サーバー情報
    </a>
</div>

</body>
</html>
